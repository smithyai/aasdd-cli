name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate spec version
        uses: smithyai/aasdd-release@v1.0.2
        with:
          spec-path: spec/spec.md
          enforce-tag-match: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up AUR SSH key
        if: ${{ secrets.AUR_SSH_KEY != '' }}
        run: |
          echo "${{ secrets.AUR_SSH_KEY }}" > /tmp/aur_ssh_key
          chmod 600 /tmp/aur_ssh_key
          echo "AUR_SSH_KEY=/tmp/aur_ssh_key" >> $GITHUB_ENV

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

      - name: Publish to Cloudsmith (apt/rpm/apk)
        continue-on-error: true
        run: |
          pip install --quiet cloudsmith-cli
          find dist/ -name '*.deb' | xargs -I{} cloudsmith push deb smithyai/aasdd/any-distro/any-version {}
          find dist/ -name '*.rpm' | xargs -I{} cloudsmith push rpm smithyai/aasdd/any-version {}
          find dist/ -name '*.apk' | xargs -I{} cloudsmith push alpine smithyai/aasdd/edge/main {}
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
