name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate spec version
        uses: smithyai/aasdd-release@v1
        with:
          spec-path: spec/spec.md
          enforce-tag-match: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=homebrew_casks,scoops,aurs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Homebrew tap
        continue-on-error: true
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: publish --skip=scoops,aurs,dockers_v2,nfpms
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Publish to Scoop bucket
        continue-on-error: true
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: publish --skip=homebrew_casks,aurs,dockers_v2,nfpms
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Publish to AUR
        continue-on-error: true
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: publish --skip=homebrew_casks,scoops,dockers_v2,nfpms
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

      - name: Publish to Cloudsmith (apt/rpm/apk)
        continue-on-error: true
        run: |
          pip install --quiet cloudsmith-cli
          find dist/ -name '*.deb' | xargs -I{} cloudsmith push deb smithyai/aasdd/any-distro/any-version {}
          find dist/ -name '*.rpm' | xargs -I{} cloudsmith push rpm smithyai/aasdd/any-version {}
          find dist/ -name '*.apk' | xargs -I{} cloudsmith push alpine smithyai/aasdd/edge/main {}
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
