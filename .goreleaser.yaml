version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: aasdd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/smithyai/aasdd-cli/cmd.version={{.Version}}
      - -X github.com/smithyai/aasdd-cli/cmd.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
      - "386"
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: "386"

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

nfpms:
  - id: aasdd
    package_name: aasdd
    vendor: smithyai
    homepage: https://github.com/smithyai/aasdd-cli
    maintainer: smithyai <https://github.com/smithyai>
    description: AASDD CLI — verify and scaffold AASDD specs
    license: MIT
    formats:
      - deb
      - rpm
      - apk

homebrew_casks:
  - repository:
      owner: smithyai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/smithyai/aasdd-cli
    description: AASDD CLI — verify and scaffold AASDD specs
    license: MIT
    binaries:
      - aasdd
    custom_block: |
      postflight do
        system "xattr", "-dr", "com.apple.quarantine", staged_path.to_s
      end

scoops:
  - repository:
      owner: smithyai
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: https://github.com/smithyai/aasdd-cli
    description: AASDD CLI — verify and scaffold AASDD specs
    license: MIT

dockers_v2:
  - images:
      - ghcr.io/smithyai/aasdd-cli
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v6
      - linux/arm/v7
      - linux/386

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: smithyai
    name: aasdd-cli
